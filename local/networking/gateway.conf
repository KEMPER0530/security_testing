# Read-only bridge to the fixed fixture; never forwards to arbitrary origins.
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    return 444;
}
server {
    listen 80;
    server_name fixture.security-testing.test;
    access_log off;
    location / {
        limit_except GET HEAD { deny all; }
        proxy_set_header Host fixture.security-testing.test;
        proxy_set_header Connection "";
        proxy_pass http://172.31.0.10;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
}
