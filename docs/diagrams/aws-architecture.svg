<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="805" viewBox="0 0 1400 805"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#4b7568"/></marker></defs><style>text{font:18px Arial,sans-serif;fill:#123f39}.small{font:13px Arial,sans-serif;fill:#527366}</style><rect width="1400" height="805" fill="#fff"/><text x="45" y="50" font-size="28" font-weight="600">SECURITY TESTING - AWS Architecture</text><text x="45" y="80" class="small">Generic architecture - no deployment endpoints or account identifiers</text><rect x="40" y="125" width="245" height="90" rx="12" fill="#f1f7f4" stroke="#86a69a"/><text x="162.5" y="157" text-anchor="middle" font-weight="600">Browser</text><text x="162.5" y="182" text-anchor="middle" class="small">React / responsive UI</text><rect x="330" y="125" width="245" height="90" rx="12" fill="#f1f7f4" stroke="#86a69a"/><text x="452.5" y="157" text-anchor="middle" font-weight="600">CloudFront</text><text x="452.5" y="182" text-anchor="middle" class="small">HTTPS / OAC</text><rect x="620" y="125" width="245" height="90" rx="12" fill="#f1f7f4" stroke="#86a69a"/><text x="742.5" y="157" text-anchor="middle" font-weight="600">Private S3</text><text x="742.5" y="182" text-anchor="middle" class="small">Frontend assets</text><rect x="1030" y="125" width="245" height="90" rx="12" fill="#f1f7f4" stroke="#86a69a"/><text x="1152.5" y="157" text-anchor="middle" font-weight="600">Cognito</text><text x="1152.5" y="182" text-anchor="middle" class="small">SRP authentication</text><rect x="40" y="300" width="245" height="90" rx="12" fill="#f1f7f4" stroke="#86a69a"/><text x="162.5" y="332" text-anchor="middle" font-weight="600">API Gateway</text><text x="162.5" y="357" text-anchor="middle" class="small">Authenticated REST API</text><rect x="330" y="300" width="245" height="90" rx="12" fill="#f1f7f4" stroke="#86a69a"/><text x="452.5" y="332" text-anchor="middle" font-weight="600">API Lambda</text><text x="452.5" y="357" text-anchor="middle" class="small">Python / FastAPI</text><rect x="620" y="300" width="245" height="90" rx="12" fill="#f1f7f4" stroke="#86a69a"/><text x="742.5" y="332" text-anchor="middle" font-weight="600">DynamoDB</text><text x="742.5" y="357" text-anchor="middle" class="small">Jobs / targets / outbox</text><rect x="1030" y="300" width="245" height="90" rx="12" fill="#f1f7f4" stroke="#86a69a"/><text x="1152.5" y="332" text-anchor="middle" font-weight="600">Streams + Dispatcher</text><text x="1152.5" y="357" text-anchor="middle" class="small">Durable queue dispatch</text><rect x="1030" y="480" width="245" height="90" rx="12" fill="#f1f7f4" stroke="#86a69a"/><text x="1152.5" y="512" text-anchor="middle" font-weight="600">SQS + DLQ</text><text x="1152.5" y="537" text-anchor="middle" class="small">Bounded concurrency</text><rect x="620" y="480" width="245" height="90" rx="12" fill="#f1f7f4" stroke="#86a69a"/><text x="742.5" y="512" text-anchor="middle" font-weight="600">Worker Lambda</text><text x="742.5" y="537" text-anchor="middle" class="small">Public-page checks</text><rect x="330" y="480" width="245" height="90" rx="12" fill="#f1f7f4" stroke="#86a69a"/><text x="452.5" y="512" text-anchor="middle" font-weight="600">Private S3</text><text x="452.5" y="537" text-anchor="middle" class="small">Diagnostic reports</text><rect x="40" y="480" width="245" height="90" rx="12" fill="#f1f7f4" stroke="#86a69a"/><text x="162.5" y="512" text-anchor="middle" font-weight="600">EventBridge + Recovery</text><text x="162.5" y="537" text-anchor="middle" class="small">Expired jobs / retries</text><path d="M285,170 L330,170" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><path d="M575,170 L620,170" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><path d="M285,345 L330,345" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><path d="M575,345 L620,345" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><path d="M865,345 L1030,345" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><path d="M1152,390 L1152,480" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><path d="M1030,525 L865,525" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><path d="M620,525 L575,525" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><text x="45" y="640" font-weight="600">Retained foundation</text><text x="45" y="670" class="small">Data, queues, identity and web delivery persist across normal application deployments.</text><text x="45" y="720" font-weight="600">Application updates</text><text x="45" y="750" class="small">Python Lambdas, API and React assets update independently of the retained foundation.</text><path d="M162,215 L162,300" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><path d="M162,125 V100 H1152 V125" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><path d="M1152,215 V260 H452 V300" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><path d="M452,390 L452,480" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><path d="M742,480 L742,390" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><path d="M162,480 V450 H742 V390" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/><path d="M162,570 V600 H1152 V570" fill="none" stroke="#4b7568" stroke-width="2" marker-end="url(#arrow)"/></svg>