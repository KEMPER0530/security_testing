[project]
name = "security-testing-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = []
[tool.uv.workspace]
members = ["services/backend", "infra/cdk"]
[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.14.3",
    "mypy==1.18.2",
    "import-linter==2.5.2",
    "httpx==0.28.1",
    "moto[dynamodb,s3,sqs]==5.1.15",
    "pypdf==6.21.4",
]
[tool.pytest.ini_options]
pythonpath = ["services/backend/src"]
testpaths = ["services/backend/tests"]
[tool.ruff]
target-version = "py313"
line-length = 110
[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
[tool.importlinter]
root_package = "site_diagnostics"
include_external_packages = true
[[tool.importlinter.contracts]]
name = "Inner layers are independent"
type = "forbidden"
source_modules = ["site_diagnostics.domain", "site_diagnostics.application"]
forbidden_modules = ["site_diagnostics.adapters", "site_diagnostics.bootstrap", "fastapi", "pydantic", "boto3", "jwt", "cvss"]
include_external_packages = true
[[tool.importlinter.contracts]]
name = "Domain cannot depend on application"
type = "forbidden"
source_modules = ["site_diagnostics.domain"]
forbidden_modules = ["site_diagnostics.application"]
